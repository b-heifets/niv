[package]
name = "niv"
version = "0.20.0"
edition = "2021"
rust-version = "1.85"
description = "Fast keyboard-driven layered NIfTI viewer for Kitty graphics terminals"
license = "MIT"
readme = "README.md"
keywords = ["nifti", "terminal", "neuroimaging", "kitty", "tui"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
csv = "1.3"
flate2 = "1.1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ndarray = "0.17"
nifti = { version = "0.18", default-features = false, features = ["ndarray_volumes"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
